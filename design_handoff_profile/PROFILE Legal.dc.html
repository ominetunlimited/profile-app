<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#F8FAFC;--surface:#FFFFFF;--surface-sunken:#F1F5F9;--border:#E5E7EB;--border-strong:#CBD5E1;--text-0:#1E293B;--text-1:#5B6B80;--text-2:#8496A9;--accent:#0057D9}
[data-theme=dark]{--bg:#060E1C;--surface:#0C1829;--surface-sunken:#050B16;--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.14);--text-0:rgba(255,255,255,.90);--text-1:rgba(255,255,255,.65);--text-2:rgba(255,255,255,.40);--accent:#4C8DFF}
body{margin:0;background:var(--bg);color:var(--text-0);font-family:Inter,system-ui,sans-serif}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style></helmet>

<div style="max-width:760px;margin:0 auto;padding:0 clamp(12px,3vw,28px) 70px">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:26px 0 18px">
<a href="PROFILE Public Hero.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none"><img src="assets/profile-mark.png" alt="PROFILE" style="display:block;height:22px;width:auto;aspect-ratio:1352/1736"><span style="font:700 13px Inter,sans-serif;color:var(--text-0)">PROFILE</span></a>
<div style="display:flex;gap:8px"><a href="PROFILE Help Centre.dc.html" style="height:34px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text-0);font:500 12px Inter,sans-serif;text-decoration:none">Help Centre</a><button type="button" onClick="{{ toggleTheme }}" style="height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-0);font:500 12px Inter,sans-serif;cursor:pointer">{{ themeLabel }}</button></div>
</div>
<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button type="button" onClick="{{ t.onSelect }}" style="padding:8px 13px;border-radius:9px;border:1.5px solid {{ t.edge }};background:{{ t.bg }};color:{{ t.ink }};font:600 12px Inter,sans-serif;cursor:pointer">{{ t.label }}</button></sc-for>
</div>

<h1 style="margin:0 0 6px;font:700 24px/1.2 Inter,sans-serif;letter-spacing:-.02em;color:var(--text-0)">{{ active.title }}</h1>
<div style="font:400 12px Inter,sans-serif;color:var(--text-2);margin-bottom:22px">Last updated {{ active.updated }} · illustrative placeholder text for design review</div>
<div style="display:flex;flex-direction:column;gap:18px">
<sc-for list="{{ active.sections }}" as="s" hint-placeholder-count="4">
<div><div style="font:700 14px Inter,sans-serif;color:var(--text-0);margin-bottom:6px">{{ s.h }}</div><div style="font:400 13px/1.7 Inter,sans-serif;color:var(--text-1)">{{ s.body }}</div></div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { theme: null, tab: "terms" };
  componentDidMount() {
    let saved = null;
    try { saved = localStorage.getItem("profile-ds-theme"); } catch (e) {}
    const t = saved || this.props.defaultTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    this.apply(t); this.setState({ theme: t });
  }
  apply(t) { document.documentElement.setAttribute("data-theme", t); document.body.setAttribute("data-theme", t); try { localStorage.setItem("profile-ds-theme", t); } catch (e) {} }
  renderVals() {
    const docs = {
      terms: { title: "Terms & Conditions", updated: "1 September 2026", sections: [
        { h: "Using PROFILE", body: "Your account represents your genuine professional identity. Misrepresenting who you are, fabricating credentials, or submitting evidence you know to be false is a violation of these terms." },
        { h: "Verification is not a guarantee", body: "A verified record confirms that a named institution or person attested to it. PROFILE does not independently investigate every claim beyond that attestation." },
        { h: "Content ownership", body: "You retain ownership of the evidence and records you upload. Verifiers retain ownership of their confirmation." },
        { h: "Termination", body: "We may suspend an account for fabricated evidence, harassment, or abuse of the verification system, with written notice and a right of appeal." }
      ] },
      privacy: { title: "Privacy Policy", updated: "1 September 2026", sections: [
        { h: "What we collect", body: "Identity information you provide, records and evidence you submit, and verification responses from institutions and employers." },
        { h: "How AI uses your data", body: "PROFILE Advisor reads your records only with your permission, to give guidance. It does not train on your data to serve other users." },
        { h: "Sharing", body: "Your data is shared only as far as your visibility settings allow, or when you explicitly share a Trust Passport." },
        { h: "Your rights", body: "You can export or delete your personal data at any time from Settings — records independently confirmed by an institution may remain in that institution's own system." }
      ] },
      cookies: { title: "Cookie Policy", updated: "1 September 2026", sections: [
        { h: "Essential cookies", body: "Required for sign-in, session security and theme preference. Cannot be disabled." },
        { h: "Analytics", body: "Aggregate, anonymised usage data used to improve the product. Can be disabled in Settings → Data & AI." },
        { h: "No advertising cookies", body: "PROFILE does not run third-party advertising and does not use tracking cookies for ad targeting." }
      ] }
    };
    const tabDefs = [{ key: "terms", label: "Terms" }, { key: "privacy", label: "Privacy Policy" }, { key: "cookies", label: "Cookie Policy" }];
    const tabs = tabDefs.map(x => { const on = this.state.tab === x.key; return { label: x.label, onSelect: () => this.setState({ tab: x.key }), bg: on ? "var(--accent)" : "var(--surface)", ink: on ? "#fff" : "var(--text-1)", edge: on ? "var(--accent)" : "var(--border)" }; });
    return {
      themeLabel: this.state.theme === "dark" ? "Dark" : "Light",
      toggleTheme: () => { const n = this.state.theme === "dark" ? "light" : "dark"; this.apply(n); this.setState({ theme: n }); },
      tabs, active: docs[this.state.tab]
    };
  }
}
</script>
</body>
</html>
