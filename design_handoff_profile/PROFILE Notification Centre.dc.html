<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#F8FAFC;--surface:#FFFFFF;--surface-sunken:#F1F5F9;--surface-active:#EEF3FB;--border:#E5E7EB;--border-strong:#CBD5E1;--text-0:#1E293B;--text-1:#5B6B80;--text-2:#8496A9;--accent:#0057D9;--accent-soft:#EDF3FE;--trust:#0E7490;--trust-soft:#ECFEFF;--gold:#8A6200;--gold-soft:#FEF6E0;--success:#04763C;--success-soft:#E8F8EE;--shadow-card:0 1px 2px rgba(16,24,40,.06)}
[data-theme=dark]{--bg:#060E1C;--surface:#0C1829;--surface-sunken:#050B16;--surface-active:#142440;--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.14);--text-0:rgba(255,255,255,.90);--text-1:rgba(255,255,255,.65);--text-2:rgba(255,255,255,.40);--accent:#4C8DFF;--accent-soft:rgba(76,141,255,.14);--trust:#00E5FF;--trust-soft:rgba(0,229,255,.10);--gold:#F4B400;--gold-soft:rgba(244,180,0,.12);--success:#3DDC7F;--success-soft:rgba(0,200,83,.13);--shadow-card:0 1px 2px rgba(0,0,0,.4)}
body{margin:0;background:var(--bg);color:var(--text-0);font-family:Inter,system-ui,sans-serif}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style></helmet>

<div style="max-width:800px;margin:0 auto;padding:0 clamp(12px,3vw,28px) 60px">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:26px 0 8px">
<h1 style="margin:0;font:700 24px/1.2 'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em;color:var(--text-0)">Notifications</h1>
<div style="display:flex;gap:8px"><button type="button" onClick="{{ markAllRead }}" style="height:34px;padding:0 13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text-0);font:600 12px Inter,sans-serif;cursor:pointer">Mark all read</button><a href="PROFILE Settings & Privacy.dc.html" style="height:34px;display:flex;align-items:center;padding:0 13px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text-0);font:600 12px Inter,sans-serif;text-decoration:none">Preferences</a></div>
</div>
<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4"><button type="button" onClick="{{ f.onSelect }}" style="padding:7px 13px;border-radius:20px;border:1.5px solid {{ f.edge }};background:{{ f.bg }};color:{{ f.ink }};font:600 11.5px Inter,sans-serif;cursor:pointer">{{ f.label }}</button></sc-for>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ filtered }}" as="n" hint-placeholder-count="6">
<div style="display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;background:{{ n.rowBg }};padding:13px 15px">
<span style="flex:none;width:32px;height:32px;border-radius:9px;background:{{ n.bg }};color:{{ n.ink }};display:flex;align-items:center;justify-content:center;font:700 12px Inter,sans-serif">{{ n.glyph }}</span>
<span style="flex:1;min-width:0"><span style="display:block;font:{{ n.font }};color:var(--text-0)">{{ n.text }}</span><span style="display:block;font:400 11px Inter,sans-serif;color:var(--text-2);margin-top:3px">{{ n.time }} · {{ n.category }}</span></span>
<sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span style="flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px"></span></sc-if>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { theme: null, filter: "all", read: {} };
  componentDidMount() {
    let saved = null;
    try { saved = localStorage.getItem("profile-ds-theme"); } catch (e) {}
    const t = saved || this.props.defaultTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    this.apply(t); this.setState({ theme: t });
  }
  apply(t) { document.documentElement.setAttribute("data-theme", t); document.body.setAttribute("data-theme", t); try { localStorage.setItem("profile-ds-theme", t); } catch (e) {} }
  renderVals() {
    const all = [
      { id: 1, glyph: "✓", bg: "var(--trust-soft)", ink: "var(--trust)", text: "Ikeja General Hospital verified your commissioning record.", time: "2h ago", category: "Verification" },
      { id: 2, glyph: "★", bg: "var(--gold-soft)", ink: "var(--gold)", text: "Your Trust Score increased to 812.", time: "1d ago", category: "Trust" },
      { id: 3, glyph: "◷", bg: "var(--surface-sunken)", ink: "var(--text-1)", text: "GRIDCo Nigeria is reviewing your maintenance record.", time: "2d ago", category: "Verification" },
      { id: 4, glyph: "!", bg: "var(--success-soft)", ink: "var(--success)", text: "New opportunity match at 91% — Renewable Systems Lead.", time: "3d ago", category: "Opportunities" },
      { id: 5, glyph: "✎", bg: "var(--accent-soft)", ink: "var(--accent)", text: "Advisor suggests adding a load-calculation credential.", time: "4d ago", category: "Career" },
      { id: 6, glyph: "@", bg: "var(--accent-soft)", ink: "var(--accent)", text: "Kwame Mensah replied to your post in West Africa Renewable Engineers.", time: "5d ago", category: "Community" }
    ];
    const q = this.state.filter;
    const filteredList = q === "all" ? all : all.filter(n => n.category.toLowerCase() === q);
    const filtered = filteredList.map(n => {
      const unread = !this.state.read[n.id];
      return { ...n, unread, font: unread ? "600 13px Inter,sans-serif" : "400 13px Inter,sans-serif", rowBg: unread ? "var(--surface-active)" : "var(--surface)" };
    });
    const filterDefs = [{ key: "all", label: "All" }, { key: "verification", label: "Verification" }, { key: "opportunities", label: "Opportunities" }, { key: "community", label: "Community" }];
    const filters = filterDefs.map(f => { const on = q === f.key; return { label: f.label, onSelect: () => this.setState({ filter: f.key }), bg: on ? "var(--accent)" : "var(--surface)", ink: on ? "#fff" : "var(--text-1)", edge: on ? "var(--accent)" : "var(--border)" }; });
    return {
      themeLabel: this.state.theme === "dark" ? "Dark" : "Light",
      toggleTheme: () => { const n = this.state.theme === "dark" ? "light" : "dark"; this.apply(n); this.setState({ theme: n }); },
      filters, filtered,
      markAllRead: () => this.setState({ read: Object.fromEntries(all.map(n => [n.id, true])) })
    };
  }
}
</script>
</body>
</html>
