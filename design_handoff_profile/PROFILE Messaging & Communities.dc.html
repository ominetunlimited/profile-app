<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#F8FAFC;--surface:#FFFFFF;--surface-sunken:#F1F5F9;--surface-active:#EEF3FB;--border:#E5E7EB;--border-strong:#CBD5E1;--text-0:#1E293B;--text-1:#5B6B80;--text-2:#8496A9;--accent:#0057D9;--accent-soft:#EDF3FE;--trust:#0E7490;--trust-soft:#ECFEFF;--shadow-card:0 1px 2px rgba(16,24,40,.06)}
[data-theme=dark]{--bg:#060E1C;--surface:#0C1829;--surface-sunken:#050B16;--surface-active:#142440;--border:rgba(255,255,255,.07);--border-strong:rgba(255,255,255,.14);--text-0:rgba(255,255,255,.90);--text-1:rgba(255,255,255,.65);--text-2:rgba(255,255,255,.40);--accent:#4C8DFF;--accent-soft:rgba(76,141,255,.14);--trust:#00E5FF;--trust-soft:rgba(0,229,255,.10);--shadow-card:0 1px 2px rgba(0,0,0,.4)}
body{margin:0;background:var(--bg);color:var(--text-0);font-family:Inter,system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style></helmet>

<div style="max-width:1180px;margin:0 auto;padding:0 clamp(12px,3vw,32px) 70px">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:26px 0 8px">
<h1 style="margin:0;font:700 26px/1.2 Inter,sans-serif;letter-spacing:-.02em;color:var(--text-0)">Messages &amp; Communities</h1>
<button type="button" onClick="{{ toggleTheme }}" style="height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-0);font:500 12.5px Inter,sans-serif;cursor:pointer">{{ themeLabel }}</button>
</div>
<div role="tablist" style="display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:20px">
<button type="button" onClick="{{ selectMsg }}" style="border:none;background:transparent;padding:0 0 12px;margin-bottom:-1px;cursor:pointer;font:{{ msgFont }};color:{{ msgColor }};border-bottom:2px solid {{ msgUnder }}">Messages</button>
<button type="button" onClick="{{ selectCom }}" style="border:none;background:transparent;padding:0 0 12px;margin-bottom:-1px;cursor:pointer;font:{{ comFont }};color:{{ comColor }};border-bottom:2px solid {{ comUnder }}">Communities</button>
</div>

<sc-if value="{{ showMsg }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;border:1px solid var(--border);border-radius:13px;background:var(--surface);box-shadow:var(--shadow-card);overflow:hidden;min-height:440px">
<div style="flex:0 0 260px;border-right:1px solid var(--border);display:flex;flex-direction:column">
<sc-for list="{{ threads }}" as="t" hint-placeholder-count="4">
<button type="button" onClick="{{ t.onSelect }}" style="text-align:left;border:none;border-bottom:1px solid var(--border);background:{{ t.bg }};padding:13px 14px;cursor:pointer;display:flex;gap:10px">
<span style="width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font:600 11px Inter,sans-serif;display:flex;align-items:center;justify-content:center;flex:none">{{ t.initials }}</span>
<span style="flex:1;min-width:0"><span style="display:flex;justify-content:space-between;gap:6px"><span style="font:600 12.5px Inter,sans-serif;color:var(--text-0)">{{ t.name }}</span><span style="font:400 10px Inter,sans-serif;color:var(--text-2)">{{ t.time }}</span></span><span style="display:block;font:400 11.5px Inter,sans-serif;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.preview }}</span></span>
</button>
</sc-for>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<div style="padding:13px 16px;border-bottom:1px solid var(--border);font:600 13px Inter,sans-serif;color:var(--text-0)">{{ activeThread.name }} <span style="font:400 11.5px Inter,sans-serif;color:var(--text-1)">· {{ activeThread.context }}</span></div>
<div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{ activeThread.messages }}" as="m" hint-placeholder-count="3">
<div style="display:flex;justify-content:{{ m.justify }}"><div style="max-width:75%;border-radius:11px;padding:10px 13px;background:{{ m.bg }}"><div style="font:400 12.5px/1.55 Inter,sans-serif;color:var(--text-0)">{{ m.text }}</div></div></div>
</sc-for>
</div>
<div style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)"><input type="text" placeholder="Write a message" style="flex:1;min-height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);color:var(--text-0);font:400 13px Inter,sans-serif;outline:none"><button type="button" style="height:40px;padding:0 15px;border:none;border-radius:9px;background:var(--accent);color:#fff;font:600 12.5px Inter,sans-serif;cursor:pointer">Send</button></div>
</div>
</div>
</sc-if>

<sc-if value="{{ showCom }}" hint-placeholder-val="{{ false }}">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px">
<sc-for list="{{ communities }}" as="c" hint-placeholder-count="4">
<div style="border:1px solid var(--border);border-radius:13px;background:var(--surface);box-shadow:var(--shadow-card);padding:17px 18px">
<a href="PROFILE Community Detail.dc.html" style="display:block;font:600 14px Inter,sans-serif;color:var(--text-0);margin-bottom:6px;text-decoration:none">{{ c.name }}</a>
<div style="font:400 12px/1.6 Inter,sans-serif;color:var(--text-1);margin-bottom:11px">{{ c.body }}</div>
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font:400 11.5px Inter,sans-serif;color:var(--text-1)">{{ c.members }} members</span>
<button type="button" style="height:32px;padding:0 12px;border:1px solid {{ c.edge }};border-radius:8px;background:{{ c.bg }};color:{{ c.ink }};font:600 11.5px Inter,sans-serif;cursor:pointer">{{ c.action }}</button>
</div>
</div>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { theme: null, tab: "msg", thread: 0 };
  componentDidMount() {
    let saved = null;
    try { saved = localStorage.getItem("profile-ds-theme"); } catch (e) {}
    const t = saved || this.props.defaultTheme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    this.apply(t); this.setState({ theme: t });
  }
  apply(t) { document.documentElement.setAttribute("data-theme", t); document.body.setAttribute("data-theme", t); try { localStorage.setItem("profile-ds-theme", t); } catch (e) {} }
  renderVals() {
    const msg = this.state.tab === "msg";
    const threadDefs = [
      { initials: "IG", name: "Ikeja General Hospital", context: "Re: verification request", time: "2h", preview: "We've confirmed the commissioning record.",
        messages: [{ justify: "flex-start", bg: "var(--surface-sunken)", text: "We've reviewed the sign-off sheet — confirming your commissioning record now." }, { justify: "flex-end", bg: "var(--accent-soft)", text: "Thank you — let me know if you need anything else from the site survey." }] },
      { initials: "AP", name: "Aurora Power — Recruiting", context: "Renewable Systems Lead", time: "1d", preview: "Could you share your availability?",
        messages: [{ justify: "flex-start", bg: "var(--surface-sunken)", text: "Your Trust Score and record depth match well for this role. Could you share your availability for a call?" }] },
      { initials: "KM", name: "Kwame Mensah", context: "Direct message", time: "3d", preview: "Good working with you on the GRIDCo site.",
        messages: [{ justify: "flex-start", bg: "var(--surface-sunken)", text: "Good working with you on the GRIDCo site — let's stay in touch." }] }
    ];
    const threads = threadDefs.map((t, i) => ({ ...t, onSelect: () => this.setState({ thread: i }), bg: this.state.thread === i ? "var(--accent-soft)" : "var(--surface)" }));
    return {
      themeLabel: this.state.theme === "dark" ? "Dark" : "Light",
      toggleTheme: () => { const n = this.state.theme === "dark" ? "light" : "dark"; this.apply(n); this.setState({ theme: n }); },
      showMsg: msg, showCom: !msg,
      selectMsg: () => this.setState({ tab: "msg" }), selectCom: () => this.setState({ tab: "com" }),
      msgFont: msg ? "600 13.5px Inter,sans-serif" : "400 13.5px Inter,sans-serif", msgColor: msg ? "var(--text-0)" : "var(--text-1)", msgUnder: msg ? "var(--accent)" : "transparent",
      comFont: !msg ? "600 13.5px Inter,sans-serif" : "400 13.5px Inter,sans-serif", comColor: !msg ? "var(--text-0)" : "var(--text-1)", comUnder: !msg ? "var(--accent)" : "transparent",
      threads, activeThread: threadDefs[this.state.thread],
      communities: [
        { name: "West Africa Renewable Engineers", body: "Field engineers sharing commissioning practice and site experience.", members: "1,240", action: "Joined", bg: "var(--surface-sunken)", ink: "var(--text-1)", edge: "var(--border-strong)" },
        { name: "Verified Verifiers Network", body: "Institutions and employers discussing verification standards.", members: "310", action: "Join", bg: "var(--accent)", ink: "#fff", edge: "var(--accent)" },
        { name: "Solar PV Mentors", body: "Mentorship matching for early-career solar engineers.", members: "560", action: "Join", bg: "var(--accent)", ink: "#fff", edge: "var(--accent)" },
        { name: "Trust & Verification Policy", body: "Discussion on how PROFILE's trust mechanics should evolve.", members: "94", action: "Joined", bg: "var(--surface-sunken)", ink: "var(--text-1)", edge: "var(--border-strong)" }
      ]
    };
  }
}
</script>
</body>
</html>
