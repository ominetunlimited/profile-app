<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/profile/icons/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/profile/icons/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" href="/brand/profile/icons/apple-touch-icon.png" />
    <!-- §29.4 PWA — installable manifest + icons. No service worker: this
         build iterates on deployed JS multiple times per session, and a
         naive cache-first SW risks serving a stale bundle after the next
         push — a worse regression than not having one. Flagged as a
         deliberate scope decision, not a silent gap. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#162660" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" type="image/svg+xml" href="/brand/profile/logo/profile-symbol-transparent.svg" />
    <meta property="og:title" content="PROFILE" />
    <meta property="og:image" content="/brand/profile/icons/social-og-1200.png" />
    <title>PROFILE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
