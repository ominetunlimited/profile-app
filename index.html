<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/profile/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/profile/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/profile/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/brand/profile/icons/apple-touch-icon.png" />
    <!-- §29.4 PWA — installable manifest + icons. No service worker: this
         build iterates on deployed JS multiple times per session, and a
         naive cache-first SW risks serving a stale bundle after the next
         push — a worse regression than not having one. Flagged as a
         deliberate scope decision, not a silent gap. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#162660" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="PROFILE" />
    <meta property="og:image" content="/brand/profile/icons/social-og-1200.png" />
    <title>PROFILE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
